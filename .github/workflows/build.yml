name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aayt-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose the executable bit.
      - run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Publish APK and AAB directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APK_FILES=(app/build/outputs/apk/release/*.apk)
          AAB_FILES=(app/build/outputs/bundle/release/*.aab)
          test ${#APK_FILES[@]} -gt 0
          test ${#AAB_FILES[@]} -gt 0
          TAG="aayt-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${APK_FILES[@]}" "${AAB_FILES[@]}" --clobber
          else
            gh release create "$TAG" "${APK_FILES[@]}" "${AAB_FILES[@]}" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "AAYouTube build ${GITHUB_RUN_NUMBER}" \
              --notes "APK and AAB from commit ${GITHUB_SHA}."
          fi
          echo "Downloads: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

